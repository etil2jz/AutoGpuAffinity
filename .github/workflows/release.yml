name: Create release
run-name: Create release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version of the program to build. This will be used for the tag and release name."
        required: true

      pre-release:
        description: "Pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $crateVersion = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'autogpuaffinity').version
          if ($env:VERSION.TrimStart("v") -ne $crateVersion) {
            throw "release version $env:VERSION does not match the version in Cargo.toml ($crateVersion)"
          }

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build
        run: .\build.ps1

      - name: Zip release
        run: Compress-Archive -Path build\AutoGpuAffinity -DestinationPath AutoGpuAffinity.zip

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.version }}
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.pre-release }}
          artifacts: AutoGpuAffinity.zip
          generateReleaseNotes: true
